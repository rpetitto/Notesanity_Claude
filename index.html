<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/notesanity.svg" />
    <link rel="apple-touch-icon" href="/notesanity.svg" />
    <!-- viewport-fit=cover pairs with the safe-area padding in index.css.
         maximum-scale is deliberately omitted so pinch-zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a73e8" />
    <meta name="description" content="Notesanity — interactive digital notebooks for your classroom." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Notesanity" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Stop iOS from turning student work into tappable phone numbers/dates. -->
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Notesanity</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
